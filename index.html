  <!-- MODAL CONTAINER -->
  <div id="appModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden">

          </button>
          <button onclick="Components.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto flex-1"></div>
      <!-- Dedicated print target: only #printArea is visible when printing (see @media print).
           Anything the "print/PDF" button should output (e.g. a certificate) must be cloned in here. -->
      <div id="printArea" class="hidden"></div>
    </div>
  </div>

  <script>
/**
 * ============================================================================
 * SECURITY HELPER — escape any user/API-supplied string before it is
 * injected into innerHTML, to prevent stored/reflected XSS.
 * ============================================================================
 */
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

/**
 * ============================================================================
 * CORE APPLICATION STATE & API BRIDGE
 * ============================================================================
 */
/**
 * วาง URL ของ Web App ที่ Deploy แล้วตรงนี้ (ลงท้ายด้วย /exec)
 * ต้องใส่ค่านี้เฉพาะกรณีที่หน้าเว็บนี้ถูกโฮสต์แยกจาก Apps Script
 * (เช่น GitHub Pages, Netlify ฯลฯ) — ถ้าหน้านี้ถูกเปิดผ่าน Web App URL
 * ของ Apps Script เองอยู่แล้ว ระบบจะใช้ google.script.run โดยอัตโนมัติ
 * และไม่จำเป็นต้องตั้งค่านี้เลย
 * ตัวอย่าง: "https://script.google.com/macros/s/AKfycb.../exec"
 */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyjb4Ov3Mjx4fex6SkyV0vfnxRZjtF1pLVV-Y2bwCuSjBfwT5AEx600gq5PyuyTYrQ/exec" // <-- ใส่ Web App URL ที่ Deploy แล้วตรงนี้ ถ้าโฮสต์หน้านี้บน GitHub Pages
};

const AppState = {
  token: localStorage.getItem('ART74_TOKEN') || null,
  user: JSON.parse(localStorage.getItem('ART74_USER') || 'null'),
  currentView: 'dashboard',
  cache: {}
};

const API = {
  async call(action, payload = {}) {
    const requestData = { action, token: AppState.token, payload };

    const handleResponse = (response) => {
      if (typeof response === 'string') {
        try { response = JSON.parse(response); } catch (e) {
          Swal.fire('ข้อผิดพลาด', 'ไม่สามารถอ่านข้อมูลตอบกลับจากเซิร์ฟเวอร์ได้', 'error');
          throw e;
        }
      }
      if (response && response.success) {
        return response.data;
      }
      // Prefer the most specific message available:
      // 1) error.details (fine-grained explanation from the server)
      // 2) error.message (message attached to the error object)
      // 3) response.message (top-level fallback)
      // 4) generic fallback string
      const err = response && response.error;
      const msg = (err && err.details) ? err.details
        : (err && err.message) ? err.message
        : (response && response.message) ? response.message
        : 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ';

      if (err && err.code === 'UNAUTHORIZED') {
        App.forceLogout('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
      } else {
        Swal.fire('เกิดข้อผิดพลาด', msg, 'error');
      }
      throw (err || new Error(msg));
    };

    // Mode 1: หน้านี้ถูกเปิดจากภายใน Apps Script Web App เอง (ไม่มีปัญหา CORS)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler((response) => {
            try { resolve(handleResponse(response)); } catch (e) { reject(e); }
          })
          .withFailureHandler((err) => {
            Swal.fire('ข้อผิดพลาดเครือข่าย', err.message || 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้', 'error');
            reject(err);
          })
          .doPost({ postData: { contents: JSON.stringify(requestData) } });
      });
    }

    // Mode 2: หน้านี้ถูกโฮสต์แยก (เช่น GitHub Pages) — เรียกข้าม origin ผ่าน fetch()
    // ใช้ Content-Type: text/plain เพื่อให้ browser มองว่าเป็น "simple request"
    // และไม่ยิง CORS preflight (OPTIONS) ซึ่ง Apps Script ตอบไม่ได้ครบ
    if (!CONFIG.API_URL) {
      const msg = 'ยังไม่ได้ตั้งค่า CONFIG.API_URL (Web App URL) ในไฟล์นี้';
      console.error(msg);
      Swal.fire('ตั้งค่าไม่ครบ', msg, 'error');
      throw new Error(msg);
    }
    try {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      });
      const text = await res.text();
      return handleResponse(text);
    } catch (err) {
      Swal.fire('ข้อผิดพลาดเครือข่าย', err.message || 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้', 'error');
      throw err;
    }
  }
};

/**
 * ============================================================================
 * MAIN APP CONTROLLER
 * ============================================================================
 */
const App = {
  async init() {
    document.getElementById('globalLoading').classList.remove('hidden');
    if (AppState.token) {
      try {
        const user = await API.call('verifySession');
        AppState.user = user;
        localStorage.setItem('ART74_USER', JSON.stringify(user));
        this.showAppLayout();
        this.navigate('dashboard');
      } catch (e) {
        this.showLoginView();
      }
    } else {
      this.showLoginView();
    }
    document.getElementById('globalLoading').classList.add('hidden');
  },

  forceLogout(message) {
    AppState.token = null; AppState.user = null;
    localStorage.removeItem('ART74_TOKEN'); localStorage.removeItem('ART74_USER');
    this.showLoginView();
    if (message) Swal.fire('แจ้งเตือน', message, 'warning');
  },

  showLoginView() {
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('publicView').classList.add('hidden');
    document.getElementById('appLayout').classList.add('hidden');
  },

  showAppLayout() {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('publicView').classList.add('hidden');
    document.getElementById('appLayout').classList.remove('hidden');
    document.getElementById('navUserDisplayName').textContent = AppState.user.displayName;
    document.getElementById('navUserRole').textContent = this.getRoleBadgeText(AppState.user.role);
    this.renderSidebar();
  },

  getRoleBadgeText(role) {
    switch (role) {
      case 'SUPER_ADMIN': return 'ผู้ดูแลระบบสูงสุด';
      case 'ADMIN': return 'ผู้ดูแลระบบ';
      case 'COMMITTEE': return 'กรรมการตัดสิน';
      case 'SCHOOL': return 'ตัวแทนโรงเรียน';
      case 'VIEWER': return 'ผู้เยี่ยมชม';
      default: return role;
    }
  },

  renderSidebar() {
    const role = AppState.user.role;
    const isAdmin = (role === 'SUPER_ADMIN' || role === 'ADMIN');
    const item = (view, icon, label) =>
      `<a href="#" onclick="App.navigate('${view}')" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 transition" id="nav-${view}">
        <i class="fa-solid ${icon} w-5 text-center"></i> ${label}
      </a>`;
    const groupLabel = (label) => `<p class="px-4 pt-4 pb-1 text-[11px] uppercase tracking-wider text-slate-500 font-semibold">${label}</p>`;

    let menuHtml = item('dashboard', 'fa-chart-pie', 'แผงควบคุม');
    menuHtml += item('registrations', 'fa-clipboard-list', 'ลงทะเบียนแข่งขัน');
    menuHtml += item('publicResults', 'fa-trophy', 'ประกาศผลการแข่งขัน');

    if (isAdmin || role === 'COMMITTEE') {
      menuHtml += groupLabel('การแข่งขัน');
      menuHtml += item('scoring', 'fa-star', 'บันทึกคะแนน');
      menuHtml += item('results', 'fa-medal', 'ประมวลผล/ประกาศผล');
      menuHtml += item('schedules', 'fa-calendar-days', 'ตารางการแข่งขัน');
    }

    if (isAdmin) {
      menuHtml += groupLabel('บริหารจัดการ');
      menuHtml += item('schools', 'fa-school', 'จัดการโรงเรียน');
      menuHtml += item('activities', 'fa-list-check', 'รายการแข่งขัน');
      menuHtml += item('judges', 'fa-user-tie', 'กรรมการตัดสิน');
    }

    if (role === 'SUPER_ADMIN') {
      menuHtml += item('users', 'fa-users-gear', 'ผู้ใช้งานระบบ');
      menuHtml += item('settings', 'fa-gears', 'ตั้งค่าระบบ');
      menuHtml += item('auditlog', 'fa-file-shield', 'ประวัติการใช้งาน');
    }

    menuHtml += groupLabel('เกียรติบัตร');
    menuHtml += item('certVerify', 'fa-qrcode', 'ตรวจสอบเกียรติบัตร');

    document.getElementById('sidebarMenu').innerHTML = menuHtml;
  },

  navigate(viewName) {
    AppState.currentView = viewName;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-item-active'));
    const activeNav = document.getElementById(`nav-${viewName}`);
    if (activeNav) activeNav.classList.add('nav-item-active');

    const routes = {
      dashboard: Views.renderDashboard,
      registrations: Views.renderRegistrations,
      scoring: Views.renderScoring,
      schools: Views.renderSchools,
      activities: Views.renderActivities,
      judges: Views.renderJudges,
      schedules: Views.renderSchedules,
      results: Views.renderResultsAdmin,
      publicResults: Views.renderPublicResultsPage,
      users: Views.renderUsers,
      settings: Views.renderSettings,
      auditlog: Views.renderAuditLog,
      certVerify: Views.renderCertVerify
    };
    if (typeof routes[viewName] === 'function') {
      routes[viewName].call(Views);
    } else {
      document.getElementById('pageTitle').textContent = 'ไม่พบหน้านี้';
      document.getElementById('mainContent').innerHTML = Components.emptyState('หน้านี้ยังไม่พร้อมใช้งาน', 'fa-triangle-exclamation');
    }
  },

  async handleLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('btnLoginSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...';

    try {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      const res = await API.call('login', { username, password });
      AppState.token = res.token;
      AppState.user = res.user;
      localStorage.setItem('ART74_TOKEN', res.token);
      localStorage.setItem('ART74_USER', JSON.stringify(res.user));

      Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1200, showConfirmButton: false });

      this.showAppLayout();
      this.navigate('dashboard');
    } catch (err) {
      // Error handled by API.call
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span>เข้าสู่ระบบ</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>';
    }
  },

  async handleLogout() {
    const result = await Swal.fire({
      title: 'ยืนยันการออกจากระบบ?', icon: 'question', showCancelButton: true,
      confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก'
    });
    if (result.isConfirmed) {
      try { await API.call('logout'); } catch (e) {}
      AppState.token = null; AppState.user = null;
      localStorage.removeItem('ART74_TOKEN'); localStorage.removeItem('ART74_USER');
      this.showLoginView();
    }
  }
};

window.addEventListener('DOMContentLoaded', () => { App.init(); });

/**
 * ============================================================================
 * REUSABLE UI COMPONENTS
 * ============================================================================
 */
/**
 * ============================================================================
 * REUSABLE UI COMPONENTS
 * ============================================================================
 */
const Components = {
  loadingSpinner() {
    return `<div class="flex flex-col items-center justify-center p-12 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-indigo-600"></i>
      <p class="text-sm font-medium">กำลังโหลดข้อมูล...</p>
    </div>`;
  },

  skeletonTable(rows = 5) {
    let html = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-3">`;
    for (let i = 0; i < rows; i++) html += `<div class="skeleton h-10 rounded-lg"></div>`;
    html += `</div>`;
    return html;
  },

  emptyState(text, icon = 'fa-inbox') {
    return `<div class="flex flex-col items-center justify-center p-12 text-slate-400">
      <i class="fa-solid ${escapeHtml(icon)} text-5xl mb-3 text-slate-300"></i>
      <p class="text-sm font-medium">${escapeHtml(text)}</p>
    </div>`;
  },

  errorState(text) {
    return `<div class="flex flex-col items-center justify-center p-12 text-red-400">
      <i class="fa-solid fa-triangle-exclamation text-5xl mb-3 text-red-300"></i>

    };
    const [cls, label] = map[status] || ['bg-slate-100 text-slate-600', status];
    return `<span class="px-2.5 py-1 rounded-full text-xs font-medium ${cls}">${escapeHtml(label)}</span>`;
  },

  medalBadge(medal) {
    const map = {
      'ทอง': 'bg-amber-100 text-amber-800 border border-amber-300',
      'เงิน': 'bg-slate-200 text-slate-700 border border-slate-300',
      'ทองแดง': 'bg-orange-100 text-orange-800 border border-orange-300',
      'เข้าร่วม': 'bg-slate-50 text-slate-500 border border-slate-200'
    };
    if (!medal) return '-';
    return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${map[medal] || ''}">${escapeHtml(medal)}</span>`;
  },

  openModal(title, contentHtml, showPrint = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = contentHtml;
    document.getElementById('modalPrintBtn').classList.toggle('hidden', !showPrint);
    document.getElementById('appModal').classList.remove('hidden');
  },

  closeModal() {
    document.getElementById('appModal').classList.add('hidden');
    document.getElementById('modalBody').innerHTML = '';
    document.getElementById('printArea').innerHTML = '';
  },

  toast(icon, title) {
    Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2200, timerProgressBar: true });
  },

  formatDateThai(iso) {
    if (!iso) return '-';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' +
        d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }
};

/**
 * Simple client-side table helper: search + sort + pagination (no external deps required)
 */
const TableUX = {
  state: {},
  init(key, data) {
    this.state[key] = { data, filtered: data.slice(), page: 1, pageSize: 10, query: '' };
  },
  search(key, query) {
    const s = this.state[key];
    s.query = query.toLowerCase();
    s.filtered = s.query
      ? s.data.filter(row => JSON.stringify(row).toLowerCase().indexOf(s.query) !== -1)
      : s.data.slice();
    s.page = 1;
  },
  paginate(key) {
    const s = this.state[key];
    const start = (s.page - 1) * s.pageSize;
    return s.filtered.slice(start, start + s.pageSize);
  },
  pageInfo(key) {
    const s = this.state[key];
    const totalPages = Math.max(1, Math.ceil(s.filtered.length / s.pageSize));
    return { page: s.page, totalPages, total: s.filtered.length };
  },
  setPage(key, page) {
    const s = this.state[key];
    const info = this.pageInfo(key);
    s.page = Math.min(Math.max(1, page), info.totalPages);
  },
  paginationControls(key, renderFn) {
    const info = this.pageInfo(key);
    return `<div class="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-500">
      <span>ทั้งหมด ${info.total} รายการ · หน้า ${info.page}/${info.totalPages}</span>
      <div class="flex gap-1">
        <button onclick="${renderFn}(${info.page - 1})" ${info.page <= 1 ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:bg-slate-50"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="${renderFn}(${info.page + 1})" ${info.page >= info.totalPages ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-slate-200 disabled:opacity-40 hover:bg-slate-50"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>`;
  }
};

function exportTableToCSV(data, filename) {
  if (!data || data.length === 0) { Components.toast('warning', 'ไม่มีข้อมูลสำหรับ Export'); return; }
  const headers = Object.keys(data[0]).filter(k => typeof data[0][k] !== 'object');
  const rows = data.map(row => headers.map(h => `"${String(row[h] ?? '').replace(/"/g, '""')}"`).join(','));
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename + '.csv';
  link.click();
}

Views.submitRegistrationForm = async function (event, regId) {
  event.preventDefault();
  const activityId = document.getElementById('regActivitySelect').value;
  if (!activityId) { Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการแข่งขัน', 'warning'); return; }

  const students = Array.from(document.getElementById('studentRows').children).map(row => ({
    prefix: row.querySelector('.s-prefix').value, firstName: row.querySelector('.s-fname').value,
    lastName: row.querySelector('.s-lname').value, grade: row.querySelector('.s-grade').value,
    studentCode: row.querySelector('.s-code').value
  }));
  const teachers = Array.from(document.getElementById('teacherRows').children).map(row => ({
    prefix: row.querySelector('.t-prefix').value, firstName: row.querySelector('.t-fname').value,
    lastName: row.querySelector('.t-lname').value, position: row.querySelector('.t-position').value,
    phone: row.querySelector('.t-phone').value
  }));

  // Client-side check against the selected activity's min/max headcount,
  // mirroring whatever the server enforces (server remains source of truth).
  const sel = document.getElementById('regActivitySelect');
  const opt = sel.options[sel.selectedIndex];
  if (opt && opt.value) {
    const minS = parseInt(opt.dataset.minS, 10) || 0;
    const maxS = parseInt(opt.dataset.maxS, 10) || Infinity;
    const minT = parseInt(opt.dataset.minT, 10) || 0;
    const maxT = parseInt(opt.dataset.maxT, 10) || Infinity;
    if (students.length < minS || students.length > maxS) {
      Swal.fire('แจ้งเตือน', `จำนวนนักเรียนต้องอยู่ระหว่าง ${minS}-${maxS} คน`, 'warning');
      return;
    }
    if (teachers.length < minT || teachers.length > maxT) {
      Swal.fire('แจ้งเตือน', `จำนวนครูผู้ควบคุมต้องอยู่ระหว่าง ${minT}-${maxT} คน`, 'warning');
      return;
    }
  }

  try {
    await API.call('saveRegistration', { registrationId: regId || undefined, activityId, students, teachers, notes: document.getElementById('regNotes').value });
    Components.closeModal();
    Components.toast('success', 'บันทึกข้อมูลการลงทะเบียนสำเร็จ');
    this.renderRegistrations();
  } catch (e) {}
};

 * into #printArea so window.print() (triggered by modalPrintBtn) only

Views.viewCertificate = async function (regId) {
  Components.openModal('เกียรติบัตร', Components.loadingSpinner());
  try {
    const certs = await API.call('getCertificateData', { registrationId: regId });
    if (!certs || certs.length === 0) {
      document.getElementById('modalBody').innerHTML = Components.emptyState('ยังไม่มีข้อมูลเกียรติบัตรสำหรับรายการนี้');
      return;
    }
    const certHtml = certs.map(cert => `
      <div class="cert-page text-center p-10 border-4 border-amber-400 rounded-2xl">
        ${!cert.isOfficial ? '<p class="text-xs font-bold text-red-500 mb-2">** ตัวอย่างเบื้องต้น ยังไม่เป็นทางการ (รอประกาศผลอย่างเป็นทางการ) **</p>' : ''}
        <i class="fa-solid fa-award text-5xl text-amber-500 mb-4"></i>

        <p class="text-slate-600 mb-1">งานศิลปหัตถกรรมนักเรียน ครั้งที่ 74</p>
        <p class="text-xs text-slate-400">${escapeHtml(cert.certNumber)}</p>
        <p class="text-lg font-semibold mt-4">${escapeHtml(cert.recipientName)} <span class="text-xs font-normal text-slate-400">(${escapeHtml(cert.recipientType)})</span></p>
        <p class="text-slate-600">${escapeHtml(cert.activityName)}</p>
        <p class="text-slate-600">โรงเรียน${escapeHtml(cert.schoolName)}</p>

        <p class="text-xs text-slate-400 mt-2">ออกให้เมื่อ ${escapeHtml(cert.issueDate)}</p>
      </div>`).join('');
    document.getElementById('modalBody').innerHTML = certHtml;
    document.getElementById('printArea').innerHTML = certHtml;
    document.getElementById('modalPrintBtn').classList.remove('hidden');
  } catch (e) {
    document.getElementById('modalBody').innerHTML = Components.errorState('ไม่สามารถโหลดเกียรติบัตรได้');
  }

Views.loadActivityScoring = async function (activityId) {
  if (!activityId) { document.getElementById('scoringTableContainer').innerHTML = ''; return; }
  const container = document.getElementById('scoringTableContainer');
  container.innerHTML = Components.skeletonTable(3);

  const sel = document.getElementById('scoreActivitySelect');
  const maxScore = sel.options[sel.selectedIndex].dataset.max || 100;

  const [regs, scores] = await Promise.all([API.call('getRegistrations'), API.call('getResultsByActivity', { activityId })]);
  const filtered = regs.filter(r => r.activityId === activityId && r.status === 'APPROVED');
  const scoreMap = {}; scores.forEach(s => scoreMap[s.registrationId] = s);

  let html = `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-100 text-slate-600">
          <tr><th class="p-4">โรงเรียน</th><th class="p-4">คะแนนดิบ (0-${maxScore})</th><th class="p-4">หักคะแนน</th>
          <th class="p-4 text-center">คะแนนสุทธิ / อันดับ</th><th class="p-4 text-center">สถานะ</th><th class="p-4 text-center">จัดการ</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
  `;

  } else {
    filtered.forEach(r => {
      const sc = scoreMap[r.registrationId];
      const locked = sc && sc.status === 'LOCKED';
      html += `
        <tr>
          <td class="p-4 font-semibold text-slate-800">${r.schoolName}</td>
          <td class="p-4"><input type="number" step="0.01" id="score_${r.registrationId}" value="${sc ? sc.score : ''}" ${locked ? 'disabled' : ''} class="w-24 p-2 border rounded-lg" placeholder="0-${maxScore}"></td>
          <td class="p-4"><input type="number" step="0.01" id="deduct_${r.registrationId}" value="${sc ? sc.deduction : 0}" ${locked ? 'disabled' : ''} class="w-24 p-2 border rounded-lg"></td>
          <td class="p-4 text-center">${sc ? `<b>${sc.finalScore}</b> ${Components.medalBadge(sc.medal)} <span class="text-xs text-slate-400">อันดับ ${sc.rank}</span>` : '-'}</td>
          <td class="p-4 text-center">${sc ? Components.statusBadge(sc.status === 'LOCKED' ? 'INACTIVE' : 'ACTIVE') : '-'}</td>
          <td class="p-4 text-center whitespace-nowrap">
            ${!locked ? `<button onclick="Views.saveScoreSubmit('${r.registrationId}', '${activityId}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">บันทึก</button>` : ''}
            ${sc && !locked ? `<button onclick="Views.lockScore('${sc.scoreId}', '${activityId}')" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold ml-1"><i class="fa-solid fa-lock"></i></button>` : ''}
            ${sc && locked ? `<button onclick="Views.reopenScore('${sc.scoreId}', '${activityId}')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-semibold"><i class="fa-solid fa-lock-open"></i> ปลดล็อก</button>` : ''}
          </td>
        </tr>`;
    });
  }
  html += `</tbody></table></div></div>`;
  container.innerHTML = html;
};

Views.saveScoreSubmit = async function (regId, actId) {
  const score = document.getElementById(`score_${regId}`).value;
  const deduction = document.getElementById(`deduct_${regId}`).value;
  if (score === '') { Swal.fire('แจ้งเตือน', 'กรุณากรอกคะแนน', 'warning'); return; }
  try {
    await API.call('saveScore', { registrationId: regId, activityId: actId, score, deduction });
    Components.toast('success', 'บันทึกคะแนนเรียบร้อยแล้ว');
    this.loadActivityScoring(actId);
  } catch (e) {}
};

Views.lockScore = async function (scoreId, actId) {
  const confirm = await Swal.fire({ title: 'ล็อกคะแนนนี้?', text: 'หลังล็อกแล้วจะแก้ไขไม่ได้ (ยกเว้น Super Admin ปลดล็อก)', icon: 'question', showCancelButton: true, confirmButtonText: 'ล็อก' });
  if (!confirm.isConfirmed) return;
  try { await API.call('lockScore', { scoreId }); Components.toast('success', 'ล็อกคะแนนสำเร็จ'); this.loadActivityScoring(actId); } catch (e) {}
};

Views.reopenScore = async function (scoreId, actId) {
  try { await API.call('reopenScore', { scoreId }); Components.toast('success', 'ปลดล็อกคะแนนสำเร็จ'); this.loadActivityScoring(actId); } catch (e) {}
};

      <div><label class="block text-xs font-medium text-slate-600 mb-1">ระดับชั้น *</label><input id="a_level" required value="${a ? a.level : ''}" placeholder="เช่น ป.4-6" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">ช่วงอายุ</label><input id="a_ageGroup" value="${a ? a.ageGroup || '' : ''}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">ประเภทการแข่งขัน</label>
        <select id="a_competitionType" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
          ${['เดี่ยว', 'คู่', 'ทีม', 'กลุ่ม'].map(t => `<option ${a && a.competitionType === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">นักเรียนต่ำสุด *</label><input id="a_minStudents" type="number" min="0" required value="${a ? a.minStudents : 1}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">นักเรียนสูงสุด *</label><input id="a_maxStudents" type="number" min="0" required value="${a ? a.maxStudents : 1}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">ครูต่ำสุด *</label><input id="a_minTeachers" type="number" min="0" required value="${a ? a.minTeachers : 1}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">ครูสูงสุด *</label><input id="a_maxTeachers" type="number" min="0" required value="${a ? a.maxTeachers : 1}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">คะแนนเต็ม</label><input id="a_scoreType" type="number" value="${a ? a.scoreType : 100}" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">สถานะ</label>
        <select id="a_status" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
          <option value="ACTIVE" ${a && a.status === 'ACTIVE' ? 'selected' : ''}>ใช้งาน</option>
          <option value="INACTIVE" ${a && a.status === 'INACTIVE' ? 'selected' : ''}>ปิดใช้งาน</option>
        </select>
      </div>
      <div class="md:col-span-2"><label class="block text-xs font-medium text-slate-600 mb-1">เกณฑ์การให้คะแนน</label><textarea id="a_criteria" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">${a ? a.criteria || '' : ''}</textarea></div>
      <div class="md:col-span-2"><button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div>
    </form>
  `;
  Components.openModal(a ? 'แก้ไขรายการแข่งขัน' : 'เพิ่มรายการแข่งขันใหม่', html);
};

Views.submitActivityForm = async function (event, activityId) {
  event.preventDefault();
  const payload = {
    activityId: activityId || undefined,
    activityCode: document.getElementById('a_code').value, activityName: document.getElementById('a_name').value,
    category: document.getElementById('a_category').value, level: document.getElementById('a_level').value,
    ageGroup: document.getElementById('a_ageGroup').value, competitionType: document.getElementById('a_competitionType').value,
    minStudents: document.getElementById('a_minStudents').value, maxStudents: document.getElementById('a_maxStudents').value,
    minTeachers: document.getElementById('a_minTeachers').value, maxTeachers: document.getElementById('a_maxTeachers').value,
    scoreType: document.getElementById('a_scoreType').value, status: document.getElementById('a_status').value,
    criteria: document.getElementById('a_criteria').value
  };
  try {
    await API.call('saveActivity', payload);
    Components.closeModal(); Components.toast('success', 'บันทึกรายการแข่งขันสำเร็จ');
    this.renderActivities();
  } catch (e) {}
};

Views.deleteActivityConfirm = async function (activityId) {
  const confirm = await Swal.fire({ title: 'ยืนยันลบรายการแข่งขัน?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ' });
  if (!confirm.isConfirmed) return;
  try { await API.call('deleteActivity', { activityId }); Components.toast('success', 'ลบรายการสำเร็จ'); this.renderActivities(); } catch (e) {}
};

window.addEventListener('DOMContentLoaded', () => { App.init(); });
</script>
</body>
</html>
